<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<title>A Little Something For You 💙</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{
  overflow:hidden;
  background:radial-gradient(circle at 50% 40%,#17295c 0%,#09132f 35%,#030611 80%);
  color:white;font-family:'Poppins',sans-serif;
}
.scene{
  position:relative;width:100%;height:100vh;min-height:600px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.glow{
  position:absolute;width:500px;height:500px;border-radius:50%;
  background:rgba(43,111,255,.13);filter:blur(70px);
  animation:breathing 5s ease-in-out infinite;
}
@keyframes breathing{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:.9}}

.stars,.stars:before,.stars:after{
  position:absolute;inset:0;content:"";
  background-image:radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),
                   radial-gradient(circle,rgba(120,180,255,.7) 1px,transparent 1px);
  background-size:100px 100px,170px 170px;
  background-position:10px 20px,50px 80px;
  opacity:.25;
}
.stars:before{transform:scale(1.4);opacity:.12}
.stars:after{transform:scale(.8);opacity:.18}

.intro{
  position:absolute;top:8%;text-align:center;z-index:5;
  transition:opacity 1s ease,transform 1s ease;
}
.intro.hide{opacity:0;transform:translateY(-20px)}
.small-text{font-size:13px;letter-spacing:4px;text-transform:uppercase;opacity:.7}
.intro h1{
  margin-top:8px;font-family:'Great Vibes',cursive;
  font-size:clamp(38px,8vw,68px);font-weight:400;color:#dceaff;
  text-shadow:0 0 25px rgba(90,150,255,.55);
}

.envelope-wrapper{
  position:relative;width:330px;height:230px;z-index:4;
  transform:translateY(80px) scale(.95);
  transition:transform 1.4s cubic-bezier(.2,.8,.2,1);
}
.envelope-wrapper.open{transform:translateY(100px) scale(.95)}
.envelope{
  position:absolute;left:0;bottom:0;width:330px;height:220px;
  border-radius:8px;background:linear-gradient(145deg,#f7f8ff,#b9c5dc);
  box-shadow:0 25px 60px rgba(0,0,0,.55),0 0 35px rgba(90,150,255,.18);
}
.envelope:before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(145deg,transparent 49%,rgba(70,90,130,.18) 50%,transparent 51%);
  z-index:3;
}
.left-fold,.right-fold{
  position:absolute;bottom:0;width:0;height:0;border-style:solid;z-index:3;
}
.left-fold{left:0;border-width:0 0 220px 165px;border-color:transparent transparent #d6dceb transparent}
.right-fold{right:0;border-width:220px 0 0 165px;border-color:transparent transparent transparent #c3cde0}
.flap{
  position:absolute;top:0;left:0;width:0;height:0;
  border-left:165px solid transparent;border-right:165px solid transparent;
  border-top:125px solid #dce3f1;transform-origin:top center;
  z-index:7;filter:drop-shadow(0 5px 5px rgba(0,0,0,.12));
  transition:transform 1.3s cubic-bezier(.2,.8,.2,1),z-index .1s;
}
.open .flap{transform:rotateX(180deg);z-index:1}
.seal{
  position:absolute;left:50%;top:88px;transform:translateX(-50%);
  width:45px;height:45px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#5798ff,#123b9b);
  box-shadow:0 4px 15px rgba(20,70,180,.5);z-index:8;
  display:flex;align-items:center;justify-content:center;font-size:21px;
  transition:opacity .4s ease;
}
.open .seal{opacity:0}

.orchid{
  position:absolute;width:230px;height:330px;left:50%;bottom:145px;
  transform:translateX(-50%) translateY(150px) scale(.3);
  transform-origin:bottom center;opacity:0;z-index:2;
  transition:transform 2s cubic-bezier(.17,.84,.32,1),opacity 1s ease;
}
.open .orchid{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.stem{
  position:absolute;width:5px;height:280px;left:50%;bottom:0;
  transform:translateX(-50%) rotate(5deg);transform-origin:bottom;
  background:linear-gradient(to top,#183d30,#64a86e);border-radius:10px;
}
.leaf{
  position:absolute;width:75px;height:28px;
  background:linear-gradient(135deg,#214f38,#75b778);
  border-radius:100% 0 100% 0;
}
.leaf.one{left:65px;bottom:65px;transform:rotate(18deg)}
.leaf.two{right:55px;bottom:105px;transform:scaleX(-1) rotate(12deg)}

.flower{
  position:absolute;left:50%;top:5px;width:170px;height:150px;
  transform:translateX(-50%);animation:flowerFloat 4s ease-in-out infinite;
}
@keyframes flowerFloat{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-7px)}
}
.petal{
  position:absolute;left:50%;top:50%;width:73px;height:92px;
  transform-origin:50% 85%;border-radius:60% 60% 48% 48%;
  background:radial-gradient(circle at 50% 35%,#a8d7ff 0%,#4d9aff 28%,#1261d8 68%,#073b9b 100%);
  box-shadow:inset 0 0 18px rgba(255,255,255,.3),0 0 15px rgba(40,120,255,.28);
  border:1px solid rgba(190,225,255,.4);
}
.petal.p1{transform:translate(-50%,-50%) rotate(0deg) translateY(-36px)}
.petal.p2{transform:translate(-50%,-50%) rotate(72deg) translateY(-36px)}
.petal.p3{transform:translate(-50%,-50%) rotate(144deg) translateY(-36px)}
.petal.p4{transform:translate(-50%,-50%) rotate(216deg) translateY(-36px)}
.petal.p5{transform:translate(-50%,-50%) rotate(288deg) translateY(-36px)}
.center{
  position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);
  width:48px;height:58px;border-radius:45% 45% 55% 55%;
  background:radial-gradient(circle at 50% 25%,#fff0a6,#e7a52d 35%,#713c13 75%);
  box-shadow:0 0 18px rgba(255,220,90,.55);z-index:10;
}
.lip{
  position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  width:42px;height:34px;border-radius:50% 50% 60% 60%;
  background:linear-gradient(#ffcf65,#a95820);
}

.message{
  position:absolute;left:50%;bottom:7%;transform:translateX(-50%) translateY(30px);
  width:90%;max-width:600px;text-align:center;opacity:0;z-index:10;
  transition:opacity 1.5s ease,transform 1.5s ease;
}
.open .message{
  opacity:1;transform:translateX(-50%) translateY(0);transition-delay:2.8s;
}
.message .heart{font-size:24px;margin-bottom:7px}
.message h2{
  font-family:'Great Vibes',cursive;font-size:clamp(32px,7vw,52px);
  font-weight:400;color:#e8f2ff;
}
.message p{margin-top:8px;font-size:14px;line-height:1.8;color:#c8d8f5}
.signature{
  margin-top:10px;font-family:'Great Vibes',cursive;
  font-size:30px;color:#80b8ff;
}
.particle{
  position:absolute;width:8px;height:13px;border-radius:70% 30% 70% 30%;
  background:#4d9aff;opacity:0;z-index:8;
}
.open .particle{animation:fall 5s linear infinite}
@keyframes fall{
  0%{transform:translateY(-30px) rotate(0deg);opacity:0}
  15%{opacity:.9}
  100%{transform:translateY(100vh) translateX(100px) rotate(500deg);opacity:0}
}
.p1particle{left:12%;animation-delay:1s}.p2particle{left:24%;animation-delay:2.5s}
.p3particle{left:42%;animation-delay:1.7s}.p4particle{left:61%;animation-delay:3s}
.p5particle{left:78%;animation-delay:.5s}.p6particle{left:90%;animation-delay:2s}

.replay{
  position:absolute;right:20px;bottom:18px;z-index:20;
  border:1px solid rgba(150,190,255,.3);background:rgba(10,25,60,.5);
  color:#cfe2ff;padding:9px 14px;border-radius:30px;font-size:11px;
  cursor:pointer;backdrop-filter:blur(10px);opacity:0;pointer-events:none;
  transition:.4s;
}
.open .replay{opacity:1;pointer-events:auto;transition-delay:4s}
.replay:hover{background:rgba(45,90,180,.5)}

@media(max-width:500px){
  .scene{min-height:520px}
  .envelope-wrapper{transform:translateY(75px) scale(.82)}
  .envelope-wrapper.open{transform:translateY(85px) scale(.82)}
  .orchid{transform:translateX(-50%) translateY(150px) scale(.7)}
  .open .orchid{transform:translateX(-50%) translateY(0) scale(.7)}
  .message{bottom:8%}
  .message p{font-size:12px;padding:0 18px}
}
</style>
</head>

<body>
<div class="scene">
  <div class="glow"></div>
  <div class="stars"></div>

  <div class="intro" id="intro">
    <div class="small-text">A little something</div>
    <h1>for you...</h1>
  </div>

  <div class="particle p1particle"></div>
  <div class="particle p2particle"></div>
  <div class="particle p3particle"></div>
  <div class="particle p4particle"></div>
  <div class="particle p5particle"></div>
  <div class="particle p6particle"></div>

  <div class="envelope-wrapper" id="envelopeWrapper">

    <div class="orchid">
      <div class="stem"></div>
      <div class="leaf one"></div>
      <div class="leaf two"></div>

      <div class="flower">
        <div class="petals">
          <div class="petal p1"></div>
          <div class="petal p2"></div>
          <div class="petal p3"></div>
          <div class="petal p4"></div>
          <div class="petal p5"></div>
        </div>
        <div class="center"><div class="lip"></div></div>
      </div>
    </div>

    <div class="envelope">
      <div class="left-fold"></div>
      <div class="right-fold"></div>
      <div class="flap"></div>
      <div class="seal">♥</div>
    </div>
  </div>

  <div class="message">
    <div class="heart">♡</div>
    <h2>For You, My Love</h2>
    <p>
      Just like this blue orchid,<br>
      you make my world a little more beautiful. 💙
    </p>
    <div class="signature">For Vanya 💙</div>
  </div>

  <button class="replay" id="replay">↻ Replay</button>
</div>

<script>
const wrapper = document.getElementById("envelopeWrapper");
const intro = document.getElementById("intro");
const replay = document.getElementById("replay");

function openGift() {
  wrapper.classList.add("open");
  intro.classList.add("hide");
}

function replayGift() {
  wrapper.classList.remove("open");
  intro.classList.remove("hide");

  setTimeout(() => {
    openGift();
  }, 700);
}

window.addEventListener("load", () => {
  setTimeout(() => {
    openGift();
  }, 1500);
});

replay.addEventListener("click", replayGift);
</script>
</body>
</html>
